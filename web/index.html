<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SCM — Static Content Manager</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/web/styles/base.css" />
    <link rel="stylesheet" href="/web/styles/layout.css" />
    <link rel="stylesheet" href="/web/styles/components.css" />
    <script type="module" src="/web/scripts/main.js"></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a class="logo" href="/" title="SCM — Static Content Manager">
            <svg
              class="logo-mark"
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              role="img"
              aria-label="SCM logo"
            >
              <!-- JSON braces -->
              <path
                d="M8.6 3.5c-2.1 0-3 .95-3 2.8v2.2c0 1.7-.75 2.75-2.35 3.1 1.6.35 2.35 1.4 2.35 3.1v2.2c0 1.85.9 2.8 3 2.8"
              />
              <path
                d="M15.4 3.5c2.1 0 3 .95 3 2.8v2.2c0 1.7.75 2.75 2.35 3.1-1.6.35-2.35 1.4-2.35 3.1v2.2c0 1.85-.9 2.8-3 2.8"
              />
              <!-- commit + push -->
              <circle
                cx="12"
                cy="6.6"
                r="1.5"
                fill="currentColor"
                stroke="none"
              />
              <path d="M12 8.4v8.2" />
              <path d="M9.6 14.2 12 16.9l2.4-2.7" />
            </svg>
            <span class="logo-text">SCM</span>
          </a>
          <button
            class="toggle-sidebar"
            id="toggle-sidebar"
            title="Collapse sidebar"
          >
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
        </div>
        <div class="sidebar-nav">
          <a class="nav-item" id="nav-media" href="#" title="Media">
            <span class="material-symbols-outlined">image</span>
            <span>Media</span>
          </a>
          <div id="content-nav"></div>
        </div>
        <div class="sidebar-footer">
          <a class="nav-item" href="#" id="nav-settings">
            <span class="material-symbols-outlined">settings</span>
            <span>Settings</span>
          </a>
        </div>
      </nav>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- Top App Bar -->
        <header class="header">
          <div class="header-left">
            <div class="header-title" id="header-title"></div>
          </div>
          <div class="header-status" id="header-status"></div>
        </header>

        <!-- Canvas -->
        <main class="canvas">
          <div class="container" id="view-root"></div>
        </main>

        <!-- Status bar (collapsible info panel, fixed bottom) -->
        <div class="status-bar" id="status-bar"></div>
      </div>
    </div>

    <!-- Overlays -->
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack"></div>
  </body>
</html>
