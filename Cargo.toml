[package]
name = "wss_serve"
description = "SCM: local static content manager for static websites"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6.6"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: Value's map keeps insertion order (IndexMap) so saved JSON
# keeps the client's document order instead of being alphabetically sorted.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
env_logger = "0.10"
log = "0.4"
dotenv = "0.15"
