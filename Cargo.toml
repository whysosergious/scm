[package]
name = "wss_serve"
description = "SCM: local static content manager for static websites"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
env_logger = "0.10"
log = "0.4"
dotenv = "0.15"
